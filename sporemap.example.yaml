# copy to sporemap.yaml. sporemap looks in this order: SPOREMAP_CONFIG, ./sporemap.yaml, /etc/sporemap/sporemap.yaml
# secrets do NOT go here, put them in env vars, .env, or sporemap.env next to this file

# host: 127.0.0.1
# port: 8420
# scan_timeout: 120
# scan_every: 15m                  # serve scans every source this often (30s, 15m, 2h, 1d, or off)
#                                  # any source can set its own scan_every, or scan_every: off
# keep_scans: 50                   # newest scans kept per source, older ones get pruned after each round
#                                  # the latest good scan of a source always stays. off = keep everything
#                                  # shrink the db file once with: sporemap prune

sources:
  # demo: {}                       # fake lab to try sporemap without one: sporemap scan demo
  #                                # get rid of it later with: sporemap sources forget demo
  # proxmox:
  #   host: 192.168.1.10          # or a tailscale ip
  #   token_id: sporemap@pve!scan
  #   verify_ssl: false           # true if your node has a real cert
  #   scan_every: 5m              # optional, overrides the global scan_every
  #   # secret goes in .env as SPOREMAP_PROXMOX_TOKEN_SECRET
  # caddy:
  #   url: http://192.168.1.70:2020   # read-only proxy of the admin api, see "Caddy" in the README
  #   host_ip: 192.168.1.70           # the box caddy runs on
  # cloudflare:
  #   zones: [example.com]            # optional, default is every zone the token sees
  #   # token goes in .env as SPOREMAP_CLOUDFLARE_API_TOKEN
  #   # needs: Zone:Zone:Read, Zone:DNS:Read, Account:Cloudflare Tunnel:Read
  # cloudflared:                      # locally managed tunnel, read over ssh
  #   host: 192.168.1.10
  #   key_path: ~/.ssh/sporemap       # key with a forced "cat config.yml" command, see "cloudflared" in the README
  #   host_ip: 192.168.1.10           # lan ip of that box, for localhost services
  # docker:                           # one entry per machine running docker
  #   key_path: ~/.ssh/sporemap       # for hosts reached over ssh (scripts/setup-docker-host.sh)
  #   hosts:
  #     - name: nas                   # ssh mode: proxy stays on the box's 127.0.0.1:2375
  #       ssh: 192.168.1.10           # [user@]host[:port], user defaults to sporemap
  #       jump: 100.64.0.1            # optional hop, eg the proxmox host for CTs on an internal bridge
  #     - name: other
  #       url: http://192.168.1.20:2375  # direct mode, only if the proxy is firewalled to sporemap
  #       host_ip: 192.168.1.20
