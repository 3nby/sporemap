# copy to sporemap.yaml (or point SPOREMAP_CONFIG at it)
# secrets do NOT go here, put them in env vars or .env

# host: 127.0.0.1
# port: 8420
# scan_timeout: 120

sources:
  demo: {}
  # proxmox:
  #   host: 192.168.1.10          # or a tailscale ip
  #   token_id: sporemap@pve!scan
  #   verify_ssl: false           # true if your node has a real cert
  #   # secret goes in .env as SPOREMAP_PROXMOX_TOKEN_SECRET
  # caddy:
  #   url: http://192.168.1.70:2020   # read-only proxy of the admin api, see docs
  #   host_ip: 192.168.1.70           # the box caddy runs on
  # cloudflare:
  #   zones: [example.com]            # optional, default is every zone the token sees
  #   # token goes in .env as SPOREMAP_CLOUDFLARE_API_TOKEN
  #   # needs: Zone:Zone:Read, Zone:DNS:Read, Account:Cloudflare Tunnel:Read
  # cloudflared:                      # locally managed tunnel, read over ssh
  #   host: 192.168.1.10
  #   key_path: ~/.ssh/sporemap       # key with a forced "cat config.yml" command, see docs
  #   host_ip: 192.168.1.10           # lan ip of that box, for localhost services
  # docker:                           # one entry per machine running docker
  #   hosts:
  #     - name: nas
  #       url: http://127.0.0.1:2375  # read-only socket proxy, keep it off the network
  #       host_ip: 192.168.1.10
